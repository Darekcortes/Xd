<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0c1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Reinos del Caos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- Barra superior -->
  <header id="topbar">
    <div class="tb-stat" title="Vida máxima">❤️ <b id="t-hp">0</b></div>
    <div class="tb-stat gold" title="Monedas">💰 <b id="t-coins">0</b></div>
    <div class="tb-stat gem" title="Cristales">💎 <b id="t-gems">0</b></div>
    <div class="tb-stat tk" title="Tickets de ruleta">🎟️ <b id="t-tickets">0</b></div>
    <div class="tb-level" title="Nivel y experiencia">
      <span>Nv <b id="t-level">1</b></span>
      <div class="xpbar"><i id="t-xp"></i></div>
    </div>
  </header>

  <main id="screens">
    <section class="screen" id="scr-menu"></section>
    <section class="screen" id="scr-map"></section>
    <section class="screen" id="scr-wheel"></section>
    <section class="screen" id="scr-forge"></section>
    <section class="screen" id="scr-inv"></section>
    <section class="screen" id="scr-char"></section>
    <section class="screen" id="scr-settings"></section>
    <section class="screen" id="scr-missions"></section>
    <section class="screen" id="scr-trophies"></section>
    <section class="screen" id="scr-pets"></section>
    <section class="screen" id="scr-tower"></section>
    <section class="screen" id="scr-shop"></section>
    <section class="screen" id="scr-talents"></section>
    <section class="screen" id="scr-daily"></section>

    <!-- Combate -->
    <section class="screen" id="scr-battle">
      <div class="b-top">
        <button class="icon-btn" id="b-pause" data-act="pause" aria-label="Pausa">⏸</button>
        <div class="b-info">
          <div id="b-stage" class="b-stage"></div>
          <div class="b-sub"><span id="b-progress"></span><span id="b-coins"></span><span id="b-mats"></span></div>
        </div>
      </div>
      <div class="arena-wrap">
        <div class="arena-inner" id="arena-inner">
          <canvas id="arena"></canvas>
          <div id="b-boss" class="boss-bar" hidden>
            <span id="b-boss-name"></span>
            <div class="bar"><i id="b-boss-fill"></i></div>
          </div>
          <button class="ult-btn" id="b-ult" aria-label="Furia del Caos: ataque definitivo"><span>💥</span></button>
          <div class="b-hp">
            <div class="bar hp"><i id="b-hp-fill"></i><span id="b-hp-text"></span></div>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="stick-zone" id="stick-zone" aria-label="Joystick: mueve al caballero">
          <div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
        </div>
        <div class="actions">
          <button class="ctl skill" data-skill="fuego" aria-label="Ataque de fuego"><span>🔥</span><b class="cdtext"></b></button>
          <button class="ctl skill" data-skill="hielo" aria-label="Ataque de hielo"><span>❄️</span><b class="cdtext"></b></button>
          <button class="ctl skill" data-skill="rayo" aria-label="Ataque eléctrico"><span>⚡</span><b class="cdtext"></b></button>
          <button class="ctl potion" id="b-potion" aria-label="Usar poción"><span>🧪</span><b id="b-potion-count">0</b></button>
          <button class="ctl dodge" id="b-dodge" aria-label="Esquivar (mantén pulsado para correr)"><span>💨</span><b class="cdtext"></b></button>
          <button class="ctl attack" data-hold="attack" aria-label="Atacar">⚔️</button>
        </div>
      </div>
      <div class="rotate-hint" id="rotate-hint" hidden>
        <div class="rot-ico" aria-hidden="true">📱</div>
        <h3>Gira tu teléfono</h3>
        <p>Reinos del Caos se juega en horizontal.</p>
        <button class="btn ghost" data-act="portrait-ok">Jugar en vertical</button>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts"></div>
</div>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/uicons.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/sprites.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
